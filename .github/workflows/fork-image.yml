name: Fork image

# Publishes this fork's main to GHCR, named after the newest upstream release it contains.
#
# A tag push cannot drive this: GitHub runs the workflow file found at the tagged commit, and an
# upstream release commit does not carry this file. A sync lands on main instead, so every push
# to main asks whether it brought in a release that has no image yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A sync that brings several releases resolves to the newest one, and a newer push replaces a
# build still in flight.
concurrency:
  group: fork-image
  cancel-in-progress: true

env:
  UPSTREAM: https://github.com/WizisCool/oh-my-cpa.git

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the newest upstream release in this revision
        id: plan
        run: |
          # Fork syncs move branches only; release tags are read from upstream directly.
          git fetch --no-tags "$UPSTREAM" 'refs/tags/v*:refs/tags/v*'
          tag="$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip a release that already has an image
        id: published
        # A manual run always rebuilds, which is how fork-only commits reach the image.
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.published.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}
            ${{ steps.plan.outputs.image }}:latest
          build-args: |
            VERSION=${{ steps.plan.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
